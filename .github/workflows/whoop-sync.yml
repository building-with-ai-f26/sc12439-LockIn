name: Whoop nightly sync

# Aimed at 11:59 PM in New York. GitHub cron is UTC only, so both the EDT
# and EST instants are scheduled. GitHub also starts scheduled jobs late,
# sometimes by hours (10 Nov 2026: 8 hours), so scheduled runs always sync
# instead of checking the clock: the sync is idempotent (check-ins are
# deduped by Whoop id), so running twice or late is harmless.
on:
  schedule:
    - cron: "59 3 * * *"   # 23:59 EDT (Mar–Nov)
    - cron: "59 4 * * *"   # 23:59 EST (Nov–Mar)
  workflow_dispatch:
    inputs:
      force:
        description: "Run now even though it is not 11 PM Eastern"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull Whoop workouts into Supabase
        run: node scripts/whoop-sync.mjs ${{ (github.event_name == 'schedule' || inputs.force) && '--force' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          WHOOP_MIN_MINUTES: ${{ vars.WHOOP_MIN_MINUTES }}
          WHOOP_EXCLUDE_SPORTS: ${{ vars.WHOOP_EXCLUDE_SPORTS }}
